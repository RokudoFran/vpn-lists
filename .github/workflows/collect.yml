name: collect

on:
  schedule:
    - cron: "0 1 * * *"      # каждый день в 04:00 МСК
  workflow_dispatch:         # кнопка ручного запуска
  push:
    paths: [services.yaml, collector.py, manual.txt, .github/workflows/collect.yml]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python collector.py
      - name: Commit lists
        run: |
          git config user.name "list-bot"
          git config user.email "list-bot@users.noreply.github.com"
          git add lists reports
          git diff --cached --quiet || git commit -m "update lists $(date -u +%F)"
          git pull --rebase
          git push
