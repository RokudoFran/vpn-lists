name: dependabot auto-merge

# PR от Dependabot с новыми версиями Actions: прогоняем тесты и сливаем сами.
# Dependabot обновляет хеши и в этом файле, поэтому тесты идут ровно на тех версиях,
# которые он предлагает. Упали тесты — PR остаётся открытым, GitHub пришлёт письмо.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - run: pip install "pyyaml>=6,<7"
      - name: Tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Only workflow files changed
        run: |
          gh pr view "$PR_URL" --json files --jq '.files[].path' | tee files.txt
          if grep -v '^\.github/workflows/' files.txt; then
            echo "::error::PR меняет не только workflow-файлы — проверь и слей руками"
            exit 1
          fi
      - name: Merge
        run: gh pr merge --squash "$PR_URL"
      - name: Delete branch
        continue-on-error: true
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.head_ref }}"
